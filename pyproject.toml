[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intro-ml-oif"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "scikit-learn>=1.3,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
wandb = ["wandb>=0.17,<1"]

[project.scripts]
oif-baseline = "oif.baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
